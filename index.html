<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUMPULAN SCRIPT ARJ</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 8px; 
  }

  body {
    min-height: 100vh;
    background: #050505;
    background-image: radial-gradient(circle at 50% 0%, #2a0000 0%, #0a0000 60%, #050000 100%);
    color: #fff;
    padding: 15px;
    position: relative;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 40px 10px 20px;
  }

  .header h1 {
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ff2b2b;
    text-shadow: 0 0 10px #ff0000, 0 0 25px #ff0000;
  }

  /* Animasi Teks Rainbow */
  @keyframes rainbow {
    0% { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
    17% { color: #ff8800; text-shadow: 0 0 10px #ff8800; }
    33% { color: #ffff00; text-shadow: 0 0 10px #ffff00; }
    50% { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
    67% { color: #00ccff; text-shadow: 0 0 10px #00ccff; }
    83% { color: #8800ff; text-shadow: 0 0 10px #8800ff; }
    100% { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
  }

  .header p {
    margin-top: 8px;
    font-size: 0.85rem;
    letter-spacing: 2px;
    font-weight: 900;
    animation: rainbow 4s linear infinite;
  }

  /* Search & Total */
  .search-container {
    max-width: 600px;
    margin: 0 auto 15px;
    padding: 0 5px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .search-container input {
    width: 100%;
    padding: 12px 15px;
    background: #111;
    border: 1px solid #ff2b2b;
    color: #fff;
    font-size: 0.85rem;
    border-radius: 20px;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
  }

  .search-container input:focus {
    outline: none;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
  }

  .total-script {
    text-align: left;
    font-size: 0.8rem;
    color: #ff9999;
    font-weight: 700;
    padding-left: 10px;
  }

  /* Grid Card (2 Kolom) */
  .script-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); 
    gap: 10px;
    max-width: 800px;
    margin: 0 auto;
    padding-bottom: 40px;
  }

  /* Desain Kotak Script */
  .script-card {
    background: #0a0a0a;
    border: 1px solid #ff2b2b;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    min-height: 130px; 
    transition: 0.2s;
  }

  .script-card:hover {
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
  }

  .card-top {
    flex: 1; 
    margin-bottom: 10px; 
    overflow: hidden;
  }

  .card-top h4 {
    color: #ff4d4d;
    font-size: 0.85rem;
    font-weight: 800;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-top .desc {
    font-size: 0.7rem;
    color: #aaa;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-bottom {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .btn-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .btn-view, .copy-btn {
    width: 100%;
    padding: 8px;
    font-weight: 700;
    font-size: 0.7rem;
    cursor: pointer;
    border-radius: 4px;
    text-align: center;
    border: 1px solid #ff2b2b;
  }

  .btn-view {
    background: #222;
    color: #fff;
    border-color: #555;
  }

  .copy-btn {
    background: #111;
    color: #ff4d4d;
  }

  .copy-btn:hover { background: #ff2b2b; color: #fff; }
  .copy-btn.copied { border-color: #00ff88; color: #00ff88; }

  /* Modal Lihat Script */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    z-index: 999;
    justify-content: center;
    align-items: center;
    padding: 15px;
  }

  .modal.show { display: flex; }

  .modal-box {
    background: #0a0a0a;
    border: 1px solid #ff2b2b;
    padding: 15px;
    border-radius: 8px;
    max-width: 500px;
    width: 100%;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
  }

  .modal-box h3 {
    color: #ff4d4d;
    margin-bottom: 15px;
    text-align: center;
    font-size: 1rem;
  }

  .code-viewer {
    width: 100%;
    background: #000;
    color: #00ff88;
    padding: 10px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 0.75rem;
    white-space: pre-wrap;
    overflow-y: auto;
    border: 1px solid #333;
    margin-bottom: 15px;
    max-height: 60vh;
  }

  .btn {
    padding: 10px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 6px;
    text-align: center;
    width: 100%;
    border: 1px solid #ff2b2b;
    background: transparent; 
    color: #ff4d4d;
    font-size: 0.8rem;
  }

  .empty-msg {
    text-align: center;
    color: #ff9999;
    padding: 30px 10px;
    font-size: 0.85rem;
    grid-column: 1 / -1;
  }

  /* Toast Notifikasi */
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #111; border: 1px solid #00ff88; color: #00ff88;
    padding: 10px 20px; border-radius: 20px; font-size: 0.75rem;
    opacity: 0; transition: 0.3s; z-index: 1000; font-weight: 700;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="header">
    <h1>KUMPULAN SCRIPT ARJ</h1>
    <p>ARJ ONTOP #YOHANGANTENG</p>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="🔍 Cari script di sini...">
    <div class="total-script" id="totalScriptText">Total: 0 Script</div>
  </div>

  <!-- GRID SCRIPT (2 KOLOM) -->
  <div class="script-grid" id="scriptGrid">
    <!-- Diisi oleh JavaScript -->
  </div>

  <!-- MODAL LIHAT SCRIPT -->
  <div class="modal" id="viewScriptModal">
    <div class="modal-box">
      <h3 id="viewScriptTitle">📄 LIHAT SCRIPT</h3>
      <div class="code-viewer" id="viewScriptCode"></div>
      <button class="btn" id="closeViewBtn">TUTUP</button>
    </div>
  </div>

  <div class="toast" id="toast">✔ Berhasil</div>

  <!-- ========================================== -->
  <!-- LOGIC JAVASCRIPT (DATA STATIS)             -->
  <!-- ========================================== -->
  <script>
    /* ================= DATA SCRIPT ================= */
    const scripts = [
      {
        id: "1",
        title: "SCRIPT OPAH V1",
        desc: "Script Opah V1",
        content: 'loadstring(game:HttpGet("https://pastefy.app/tICqI9Q3/raw"))()'
      },
      {
        id: "2",
        title: "SCRIPT OPAH V2",
        desc: "Script Opah V2",
        content: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/yohannabil6-max/memek/refs/heads/main/LICENSE.md"))()'
      },
      {
        id: "3",
        title: "SCRIPT OPAH V3",
        desc: "Script Opah V3",
        content: 'loadstring(game:HttpGet("https://pastefy.app/tICqI9Q3/raw"))()'
      },
      {
        id: "4",
        title: "SCRIPT OPAH LAST V4 OP",
        desc: "Script Opah Last V4 OP",
        content: 'loadstring(game:HttpGet("https://web-feature-garden.lovable.app/api/public/raw/524d5775-a5fb-4516-aa2a-b93543f82590"))()'
      },
      {
        id: "5",
        title: "SCRIPT ATOK",
        desc: "Script Atok", // Keterangan KEY: 11 dihapus agar tidak bingung jika tidak butuh key
        content: 'loadstring(game:HttpGet("https://web-feature-garden.lovable.app/api/public/raw/39b0dcfa-e80c-4a84-a01b-f532451131d1"))()'
      }
    ];

    /* ================= ELEMENT ================= */
    const $ = id => document.getElementById(id);
    const grid = $("scriptGrid");
    const viewScriptModal = $("viewScriptModal");
    const toast = $("toast");
    const searchInput = $("searchInput");
    const totalScriptText = $("totalScriptText");

    /* ================= UTIL ================= */
    function showToast(msg, color = "#00ff88") {
      toast.textContent = msg;
      toast.style.borderColor = color;
      toast.style.color = color;
      toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function escapeHtml(str) {
      if(!str) return "";
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    /* ================= RENDER ================= */
    function render(filterText = "") {
      grid.innerHTML = "";

      const filtered = scripts.filter(sc => 
        (sc.title || "").toLowerCase().includes(filterText.toLowerCase()) || 
        (sc.desc || "").toLowerCase().includes(filterText.toLowerCase())
      );

      totalScriptText.textContent = `Total: ${filtered.length} Script`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-msg">Script tidak ditemukan.</div>`;
        return;
      }

      filtered.forEach(sc => {
        const card = document.createElement("div");
        card.className = "script-card";
        
        card.innerHTML = `
          <div class="card-top">
            <h4 title="${escapeHtml(sc.title)}">${escapeHtml(sc.title)}</h4>
            <div class="desc">${escapeHtml(sc.desc || "-")}</div>
          </div>
          
          <div class="card-bottom">
            <div class="btn-row">
              <button class="btn-view" data-view="${sc.id}">📄 LIHAT</button>
              <button class="copy-btn" data-id="${sc.id}">📋 COPY</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      grid.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => copyScript(btn.dataset.id, btn));
      });

      grid.querySelectorAll(".btn-view").forEach(btn => {
        btn.addEventListener("click", () => viewScript(btn.dataset.view));
      });
    }

    /* ================= PENCARIAN ================= */
    searchInput.addEventListener("input", (e) => {
      render(e.target.value);
    });

    /* ================= LIHAT SCRIPT ================= */
    function viewScript(id) {
      const sc = scripts.find(s => s.id === id);
      if (!sc) return;
      $("viewScriptTitle").textContent = "📄 " + sc.title;
      $("viewScriptCode").textContent = sc.content;
      viewScriptModal.classList.add("show");
    }

    $("closeViewBtn").addEventListener("click", () => viewScriptModal.classList.remove("show"));

    /* ================= COPY SCRIPT ================= */
    function copyScript(id, btn) {
      const sc = scripts.find(s => s.id === id);
      if (!sc) return;

      const doCopy = (text) => {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(() => {
            btn.textContent = "✔ TERSALIN!";
            btn.classList.add("copied");
            showToast("Script berhasil disalin!");
            
            setTimeout(() => {
              btn.textContent = "📋 COPY";
              btn.classList.remove("copied");
            }, 2000);
          });
        } else {
          // Fallback untuk browser lama
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
            btn.textContent = "✔ TERSALIN!";
            btn.classList.add("copied");
            showToast("Script berhasil disalin!");
            
            setTimeout(() => {
              btn.textContent = "📋 COPY";
              btn.classList.remove("copied");
            }, 2000);
          } catch (e) {
            showToast("Gagal menyalin", "#ff2b2b");
          }
          document.body.removeChild(ta);
        }
      };

      doCopy(sc.content);
    }

    /* ================= INIT ================= */
    // Tampilkan script pertama kali dimuat
    render();
  </script>
</body>
        </html>
