<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUMPULAN SCRIPT ARJ</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 8px; /* Sudut membulat tipis */
  }

  body {
    min-height: 100vh;
    background: #050505;
    color: #fff;
    padding: 15px;
    position: relative;
  }

  /* Tombol Admin */
  .admin-corner {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 100;
  }

  .btn-admin-corner {
    background: #111;
    color: #ff4d4d;
    border: 1px solid #ff2b2b;
    padding: 8px 16px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.25s;
    border-radius: 20px;
  }

  .btn-admin-corner:hover {
    background: #ff2b2b;
    color: #fff;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
  }

  /* Header */
  .header {
    text-align: center;
    padding: 50px 10px 15px;
  }

  .header h1 {
    font-size: clamp(1.3rem, 5vw, 2rem);
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ff2b2b;
    text-shadow: 0 0 10px #ff0000, 0 0 25px #ff0000;
  }

  .header p {
    margin-top: 5px;
    color: #ff9999;
    font-size: 0.75rem;
    letter-spacing: 1px;
    font-weight: 700;
  }

  /* Search & Total */
  .search-container {
    max-width: 600px;
    margin: 0 auto 10px;
    padding: 0 5px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .search-container input {
    width: 100%;
    padding: 10px 15px;
    background: #111;
    border: 1px solid #ff2b2b;
    color: #fff;
    font-size: 0.85rem;
    border-radius: 20px;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
  }

  .search-container input:focus {
    outline: none;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
  }

  /* Teks Total Script */
  .total-script {
    text-align: left;
    font-size: 0.8rem;
    color: #ff9999;
    font-weight: 700;
    padding-left: 10px;
  }

  /* Grid Card (Tata Letak Kecil & Jejer) */
  .script-grid {
    display: grid;
    /* Ini yang membuatnya jejer 3 kolom di HP */
    grid-template-columns: repeat(3, 1fr); 
    gap: 10px;
    max-width: 900px;
    margin: 0 auto;
    padding-bottom: 40px;
  }

  /* Desain Kotak Script */
  .script-card {
    background: #0a0a0a;
    border: 1px solid #ff2b2b; /* GARIS TEPI MERAH */
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: 0.2s;
  }

  .script-card:hover {
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
  }

  .script-card img {
    width: 100%;
    height: 80px; /* Gambar kecil */
    object-fit: cover;
    border-bottom: 1px solid #ff2b2b;
    background: #000;
  }

  .card-body { 
    padding: 8px; 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
  }

  .card-body h4 {
    color: #ff4d4d;
    font-size: 0.75rem;
    font-weight: 800;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-body .desc {
    font-size: 0.65rem;
    color: #aaa;
    margin-bottom: 8px;
    line-height: 1.2;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .view-counter {
    font-size: 0.6rem;
    color: #ff9999;
    text-align: center;
    font-weight: 600;
    background: #1a0000;
    padding: 4px;
    border-radius: 4px;
    border: 1px dashed #ff4d4d;
  }

  .btn-row {
    display: flex;
    flex-direction: column; /* Tombol menumpuk ke bawah agar muat di kotak kecil */
    gap: 4px;
  }

  .btn-view, .copy-btn {
    width: 100%;
    padding: 6px;
    font-weight: 700;
    font-size: 0.65rem;
    cursor: pointer;
    border-radius: 4px;
    text-align: center;
    border: 1px solid #ff2b2b;
  }

  .btn-view {
    background: #222;
    color: #fff;
    border-color: #555;
  }

  .copy-btn {
    background: #111;
    color: #ff4d4d;
  }

  .copy-btn:hover { background: #ff2b2b; color: #fff; }
  .copy-btn.copied { border-color: #00ff88; color: #00ff88; }

  .admin-card-actions { 
    display: flex; 
    gap: 4px; 
    margin-top: 5px; 
  }
  
  .admin-card-actions button {
    flex: 1; 
    padding: 5px; 
    font-size: 0.6rem; 
    border-radius: 4px; 
    cursor: pointer; 
    font-weight: 700;
    border: none;
  }

  .btn-edit { background: #ffcc00; color: #000; }
  .btn-del { background: #ff2b2b; color: #fff; }

  /* Modal & Form */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    z-index: 999;
    justify-content: center;
    align-items: center;
    padding: 15px;
  }

  .modal.show { display: flex; }

  .modal-box {
    background: #0a0a0a;
    border: 1px solid #ff2b2b;
    padding: 15px;
    border-radius: 8px;
    max-width: 400px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-box h3 {
    color: #ff4d4d;
    margin-bottom: 15px;
    text-align: center;
    font-size: 1rem;
  }

  .modal-box input, .modal-box textarea {
    width: 100%;
    padding: 10px;
    background: #111;
    border: 1px solid #333;
    color: #fff;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 0.8rem;
  }

  .modal-box label {
    display: block;
    margin-bottom: 3px;
    color: #ff9999;
    font-size: 0.7rem;
    font-weight: 600;
  }

  .modal-actions { display: flex; gap: 8px; margin-top: 10px; }
  
  .btn {
    padding: 8px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 6px;
    text-align: center;
    flex: 1;
    border: none;
    font-size: 0.75rem;
  }

  .btn-green { background: #00ff88; color: #000; }
  .btn-red { background: #ff2b2b; color: #fff; }
  .btn-outline { background: transparent; border: 1px solid #ff2b2b; color: #ff4d4d; }

  .empty-msg {
    text-align: center;
    color: #ff9999;
    padding: 30px 10px;
    font-size: 0.85rem;
    grid-column: 1 / -1;
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #111; border: 1px solid #00ff88; color: #00ff88;
    padding: 10px 20px; border-radius: 20px; font-size: 0.75rem;
    opacity: 0; transition: 0.3s; z-index: 1000; font-weight: 700;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .file-input-wrapper { position: relative; overflow: hidden; width: 100%; margin-bottom: 10px; }
  .file-input-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
  .file-input-btn {
    border: 1px dashed #ff2b2b;
    color: #ff4d4d;
    background: #111;
    padding: 10px;
    border-radius: 6px;
    text-align: center;
    display: block;
    width: 100%;
    cursor: pointer;
    font-size: 0.75rem;
  }

  .code-viewer {
    width: 100%;
    background: #000;
    color: #00ff88;
    padding: 10px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 0.75rem;
    white-space: pre-wrap;
    max-height: 50vh;
    overflow-y: auto;
    border: 1px solid #333;
    margin-bottom: 10px;
  }

  /* Responsif untuk layar sangat kecil */
  @media (max-width: 400px) {
    .script-grid { gap: 6px; }
    .card-body h4 { font-size: 0.65rem; }
    .card-body .desc { font-size: 0.55rem; }
    .btn-view, .copy-btn { font-size: 0.55rem; padding: 4px; }
  }
</style>
</head>
<body>

  <div class="admin-corner">
    <button class="btn-admin-corner" id="loginBtn">🔒 LOGIN ADMIN</button>
    <button class="btn-admin-corner" id="logoutBtn" style="display:none; border-color:#00ff88; color:#00ff88;">🚪 LOGOUT</button>
  </div>

  <div class="header">
    <h1>KUMPULAN SCRIPT ARJ</h1>
    <p>ARJ ONTOP #YOHANGANTENG</p>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="🔍 Cari script di sini...">
    <div class="total-script" id="totalScriptText">Total: 0 Script</div>
  </div>

  <!-- GRID SCRIPT (KECIL & JEJER) -->
  <div class="script-grid" id="scriptGrid">
    <div class="empty-msg">Memuat data script...</div>
  </div>

  <!-- MODAL LOGIN -->
  <div class="modal" id="loginModal">
    <div class="modal-box">
      <h3>🔐 LOGIN ADMIN</h3>
      <input type="password" id="passwordInput" placeholder="Masukkan Password" maxlength="20" style="text-align:center; letter-spacing:3px; font-size:1.2rem;">
      <div class="modal-actions">
        <button class="btn btn-green" id="submitLogin">MASUK</button>
        <button class="btn btn-red" id="closeLogin">BATAL</button>
      </div>
    </div>
  </div>

  <!-- MODAL LIHAT SCRIPT -->
  <div class="modal" id="viewScriptModal">
    <div class="modal-box">
      <h3 id="viewScriptTitle">📄 LIHAT SCRIPT</h3>
      <div class="code-viewer" id="viewScriptCode"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="closeViewBtn">TUTUP</button>
      </div>
    </div>
  </div>

  <!-- MODAL FORM ADMIN -->
  <div class="modal" id="adminFormModal">
    <div class="modal-box">
      <h3 id="formTitle">⚙️ UPLOAD SCRIPT BARU</h3>
      
      <label>Judul Script</label>
      <input type="text" id="scriptTitle" placeholder="Contoh: Auto Farm">

      <label>Pilih Foto dari Galeri</label>
      <div class="file-input-wrapper">
        <button class="file-input-btn" id="fileBtnText">📁 Pilih Gambar...</button>
        <input type="file" id="scriptFile" accept="image/*">
      </div>

      <label>Link Gambar (URL)</label>
      <input type="text" id="scriptImage" placeholder="https://...">

      <label>Deskripsi Singkat</label>
      <input type="text" id="scriptDesc" placeholder="Deskripsi...">

      <label>Isi Script (Raw Code)</label>
      <textarea id="scriptContent" placeholder="-- tempel script --"></textarea>

      <div class="modal-actions">
        <button class="btn btn-green" id="saveBtn">💾 SIMPAN</button>
        <button class="btn btn-outline" id="closeFormBtn">TUTUP</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">✔ Berhasil</div>

  <!-- ========================================== -->
  <!-- LOGIC FIREBASE & IMGBB                     -->
  <!-- ========================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // KONFIGURASI FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyDo5CH0HzspnqSMOwt6YJ_NEoJzMC-_ex8",
      authDomain: "yohanarj.firebaseapp.com",
      databaseURL: "https://yohanarj-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "yohanarj",
      storageBucket: "yohanarj.firebasestorage.app",
      messagingSenderId: "809229482324",
      appId: "1:809229482324:web:99892801a403dd6a8a70c1",
      measurementId: "G-NQ8LX794M2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'scripts');

    /* ================= KONFIGURASI ================= */
    const IMGBB_API_KEY = "7d99e80ba32f01206cc5f9ef70d98e1f"; 
    const ADMIN_PASSWORD = "11";
    const LOGIN_KEY = "arj_admin_logged";

    /* ================= STATE ================= */
    let scripts = [];
    let editingId = null;
    let isAdmin = sessionStorage.getItem(LOGIN_KEY) === "true";

    /* ================= ELEMENT ================= */
    const $ = id => document.getElementById(id);
    const grid = $("scriptGrid");
    const loginBtn = $("loginBtn");
    const logoutBtn = $("logoutBtn");
    const loginModal = $("loginModal");
    const adminFormModal = $("adminFormModal");
    const viewScriptModal = $("viewScriptModal");
    const toast = $("toast");
    const searchInput = $("searchInput");
    const fileInput = $("scriptFile");
    const fileBtnText = $("fileBtnText");
    const totalScriptText = $("totalScriptText");

    /* ================= UTIL ================= */
    function showToast(msg, color = "#00ff88") {
      toast.textContent = msg;
      toast.style.borderColor = color;
      toast.style.color = color;
      toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function escapeHtml(str) {
      if(!str) return "";
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    fileInput.addEventListener("change", (e) => {
      if(e.target.files.length > 0) {
        fileBtnText.textContent = "✅ " + e.target.files[0].name;
        fileBtnText.style.color = "#00ff88";
      }
    });

    /* ================= AMBIL DATA REALTIME ================= */
    onValue(dbRef, (snapshot) => {
      scripts = [];
      const data = snapshot.val();
      if (data) {
        for (const key in data) {
          scripts.push({ id: key, ...data[key] });
        }
        scripts.reverse(); 
      }
      render(searchInput.value);
    });

    /* ================= RENDER ================= */
    function render(filterText = "") {
      grid.innerHTML = "";

      const filtered = scripts.filter(sc => 
        (sc.title || "").toLowerCase().includes(filterText.toLowerCase()) || 
        (sc.desc || "").toLowerCase().includes(filterText.toLowerCase())
      );

      // Update Total Script di UI
      totalScriptText.textContent = `Total: ${filtered.length} Script`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-msg">Belum ada script.<br><br>${isAdmin ? 'Silakan klik + UPLOAD SCRIPT.' : 'Cek lagi nanti.'}</div>`;
        return;
      }

      filtered.forEach(sc => {
        const card = document.createElement("div");
        card.className = "script-card";
        
        let adminButtons = "";
        if (isAdmin) {
          adminButtons = `
            <div class="admin-card-actions">
              <button class="btn-edit" data-edit="${sc.id}">✏️</button>
              <button class="btn-del" data-del="${sc.id}">🗑️</button>
            </div>
          `;
        }

        const imgUrl = sc.image ? escapeHtml(sc.image) : 'https://placehold.co/600x400/1a0000/ff2b2b?text=No+Image';
        const views = sc.views || 0;

        card.innerHTML = `
          <img src="${imgUrl}" alt="${escapeHtml(sc.title)}" onerror="this.src='https://placehold.co/600x400/1a0000/ff2b2b?text=No+Image'">
          <div class="card-body">
            <h4 title="${escapeHtml(sc.title)}">${escapeHtml(sc.title)}</h4>
            <div class="desc">${escapeHtml(sc.desc || "-")}</div>
            
            <div class="card-footer">
              <div class="view-counter">👁️ ${views} Copy</div>
              <div class="btn-row">
                <button class="btn-view" data-view="${sc.id}">📄 LIHAT</button>
                <button class="copy-btn" data-id="${sc.id}">📋 COPY</button>
              </div>
              ${adminButtons}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      grid.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => copyScript(btn.dataset.id, btn));
      });

      grid.querySelectorAll(".btn-view").forEach(btn => {
        btn.addEventListener("click", () => viewScript(btn.dataset.view));
      });

      if (isAdmin) {
        grid.querySelectorAll("[data-edit]").forEach(btn =>
          btn.addEventListener("click", () => startEdit(btn.dataset.edit))
        );
        grid.querySelectorAll("[data-del]").forEach(btn =>
          btn.addEventListener("click", () => deleteScript(btn.dataset.del))
        );
      }
    }

    /* ================= PENCARIAN ================= */
    searchInput.addEventListener("input", (e) => {
      render(e.target.value);
    });

    /* ================= LIHAT SCRIPT ================= */
    function viewScript(id) {
      const sc = scripts.find(s => s.id === id);
      if (!sc) return;
      $("viewScriptTitle").textContent = "📄 " + sc.title;
      $("viewScriptCode").textContent = sc.content;
      viewScriptModal.classList.add("show");
    }

    $("closeViewBtn").addEventListener("click", () => viewScriptModal.classList.remove("show"));

    /* ================= COPY SCRIPT & TAMBAH VIEW ================= */
    function copyScript(id, btn) {
      const sc = scripts.find(s => s.id === id);
      if (!sc) return;

      const doCopy = (text) => {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(() => {
            btn.textContent = "✔!";
            btn.classList.add("copied");
            showToast("Script disalin!");
            
            const viewRef = ref(db, `scripts/${id}/views`);
            runTransaction(viewRef, (currentViews) => (currentViews || 0) + 1);

            setTimeout(() => {
              btn.textContent = "📋 COPY";
              btn.classList.remove("copied");
            }, 2000);
          });
        } else {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
            btn.textContent = "✔!";
            btn.classList.add("copied");
            showToast("Script disalin!");
            
            const viewRef = ref(db, `scripts/${id}/views`);
            runTransaction(viewRef, (currentViews) => (currentViews || 0) + 1);

            setTimeout(() => {
              btn.textContent = "📋 COPY";
              btn.classList.remove("copied");
            }, 2000);
          } catch (e) {
            showToast("Gagal menyalin", "#ff2b2b");
          }
          document.body.removeChild(ta);
        }
      };

      doCopy(sc.content);
    }

    /* ================= LOGIN / LOGOUT ================= */
    loginBtn.addEventListener("click", () => {
      loginModal.classList.add("show");
      $("passwordInput").value = "";
      setTimeout(() => $("passwordInput").focus(), 100);
    });

    $("closeLogin").addEventListener("click", () => loginModal.classList.remove("show"));
    $("submitLogin").addEventListener("click", tryLogin);
    $("passwordInput").addEventListener("keydown", e => {
      if (e.key === "Enter") tryLogin();
    });

    function tryLogin() {
      const pw = $("passwordInput").value;
      if (pw === ADMIN_PASSWORD) {
        isAdmin = true;
        sessionStorage.setItem(LOGIN_KEY, "true");
        loginModal.classList.remove("show");
        updateAdminUI();
        render(searchInput.value);
        showToast("Login admin berhasil!");
      } else {
        showToast("Password salah!", "#ff2b2b");
        $("passwordInput").value = "";
      }
    }

    logoutBtn.addEventListener("click", () => {
      isAdmin = false;
      sessionStorage.removeItem(LOGIN_KEY);
      updateAdminUI();
      render(searchInput.value);
      showToast("Logout berhasil", "#ff9999");
    });

    /* ================= FORM ADMIN ================= */
    function openForm(isEdit = false) {
      adminFormModal.classList.add("show");
      if (!isEdit) {
        $("formTitle").textContent = "⚙️ UPLOAD SCRIPT BARU";
        $("scriptTitle").value = "";
        $("scriptImage").value = "";
        $("scriptDesc").value = "";
        $("scriptContent").value = "";
        fileInput.value = ""; 
        fileBtnText.textContent = "📁 Pilih Gambar...";
        fileBtnText.style.color = "#ff4d4d";
        editingId = null;
      } else {
        $("formTitle").textContent = "✏️ EDIT SCRIPT";
      }
    }

    $("closeFormBtn").addEventListener("click", () => {
      adminFormModal.classList.remove("show");
      editingId = null;
    });

    // PROSES SIMPAN
    $("saveBtn").addEventListener("click", async () => {
      const title = $("scriptTitle").value.trim();
      const imageLink = $("scriptImage").value.trim();
      const desc  = $("scriptDesc").value.trim();
      const content = $("scriptContent").value.trim();
      const file = fileInput.files[0];

      if (!title || !content) {
        showToast("Judul & isi script wajib diisi!", "#ff2b2b");
        return;
      }

      $("saveBtn").textContent = "⏳...";
      $("saveBtn").disabled = true;

      try {
        let finalImageUrl = imageLink;

        if (file) {
          const formData = new FormData();
          formData.append("image", file);

          const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: "POST",
            body: formData
          });
          
          const result = await response.json();
          
          if (result.success) {
            finalImageUrl = result.data.url; 
          } else {
            throw new Error("Gagal upload");
          }
        }

        const dataScript = { title, image: finalImageUrl, desc, content };

        if (editingId) {
          const scriptRef = ref(db, `scripts/${editingId}`);
          update(scriptRef, dataScript).then(() => showToast("Script diupdate!"));
        } else {
          dataScript.views = 0;
          push(dbRef, dataScript).then(() => showToast("Script diupload!"));
        }

        adminFormModal.classList.remove("show");
        editingId = null;
      } catch (error) {
        console.error(error);
        showToast("Upload Gagal!", "#ff2b2b");
      } finally {
        $("saveBtn").textContent = "💾 SIMPAN";
        $("saveBtn").disabled = false;
      }
    });

    function startEdit(id) {
      const sc = scripts.find(s => s.id === id);
      if (!sc) return;
      editingId = id;
      
      $("scriptTitle").value = sc.title;
      $("scriptImage").value = sc.image || "";
      $("scriptDesc").value = sc.desc;
      $("scriptContent").value = sc.content;
      fileInput.value = "";
      fileBtnText.textContent = "📁 Ganti (Opsional)";
      
      openForm(true);
    }

    function deleteScript(id) {
      if (!confirm("Hapus script ini?")) return;
      const scriptRef = ref(db, `scripts/${id}`);
      remove(scriptRef).then(() => showToast("Script dihapus", "#ff2b2b"));
    }

    /* ================= TOMBOL TAMBAH SCRIPT (FAB) ================= */
    function updateAdminUI() {
      if (isAdmin) {
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        
        if (!document.getElementById("fabAdd")) {
          const fab = document.createElement("button");
          fab.id = "fabAdd";
          fab.innerHTML = "+ UPLOAD";
          fab.style.cssText = `
            position: fixed; bottom: 20px; right: 20px; z-index: 500;
            background: #00ff88; color: #000; border: none; padding: 12px 20px;
            border-radius: 30px; font-weight: 900; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6); font-size: 0.85rem;
          `;
          fab.onclick = () => openForm(false);
          document.body.appendChild(fab);
        }
      } else {
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        const fab = document.getElementById("fabAdd");
        if (fab) fab.remove();
      }
    }

    /* ================= INIT ================= */
    updateAdminUI();
  </script>
</body>
 </html>
