<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUMPULAN SCRIPT ARJ</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 12px; 
  }

  body {
    min-height: 100vh;
    background: #050505;
    color: #fff;
    padding: 20px;
    position: relative;
  }

  /* Tombol Admin */
  .admin-corner {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 100;
  }

  .btn-admin-corner {
    background: #111;
    color: #ff4d4d;
    border: 1px solid #ff2b2b;
    padding: 8px 16px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.25s;
    border-radius: 20px;
  }

  .btn-admin-corner:hover {
    background: #ff2b2b;
    color: #fff;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
  }

  /* Header */
  .header {
    text-align: center;
    padding: 60px 10px 20px;
  }

  .header h1 {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ff2b2b;
    text-shadow: 0 0 10px #ff0000, 0 0 25px #ff0000, 0 0 50px #990000;
    animation: glow 2s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { text-shadow: 0 0 10px #ff0000, 0 0 25px #ff0000, 0 0 50px #990000; }
    to   { text-shadow: 0 0 18px #ff4444, 0 0 45px #ff0000, 0 0 80px #cc0000; }
  }

  .header p {
    margin-top: 8px;
    color: #ff9999;
    font-size: 0.85rem;
    letter-spacing: 2px;
    font-weight: 700;
  }

  /* Search */
  .search-container {
    max-width: 500px;
    margin: 0 auto 30px;
    padding: 0 10px;
  }

  .search-container input {
    width: 100%;
    padding: 12px 20px;
    background: #111;
    border: 1px solid #ff2b2b;
    color: #fff;
    font-size: 0.9rem;
    border-radius: 30px;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
    transition: 0.3s;
  }

  .search-container input::placeholder { color: #ff9999; }

  .search-container input:focus {
    outline: none;
    box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
    background: #1a1a1a;
  }

  /* Grid Card */
  .script-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
    padding-bottom: 40px;
  }

  .script-card {
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
    display: flex;
    flex-direction: column;
  }

  .script-card:hover {
    transform: translateY(-3px);
    border-color: #ff2b2b;
  }

  .script-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-bottom: 1px solid #333;
    background: #000;
  }

  .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }

  .card-body h4 {
    color: #ff4d4d;
    margin-bottom: 8px;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 1px;
  }

  .card-body .desc {
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 15px;
    line-height: 1.4;
    flex: 1;
    font-weight: 500;
  }

  /* Tata Letak Button & View */
  .card-footer {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .view-counter {
    font-size: 0.75rem;
    color: #ff9999;
    text-align: center;
    font-weight: 600;
    background: #1a0000;
    padding: 6px;
    border-radius: 6px;
    border: 1px dashed #ff4d4d;
  }

  .copy-btn {
    width: 100%;
    padding: 12px;
    background: #111;
    border: 1px solid #ff2b2b;
    color: #ff4d4d;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 8px;
    transition: 0.25s;
    font-size: 0.9rem;
  }

  .copy-btn:hover {
    background: #ff2b2b;
    color: #fff;
  }

  .copy-btn.copied {
    border-color: #00ff88;
    color: #00ff88;
  }

  /* Modal & Form */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    z-index: 999;
    justify-content: center;
    align-items: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }

  .modal.show { display: flex; }

  .modal-box {
    background: #0a0a0a;
    border: 1px solid #ff2b2b;
    padding: 25px;
    border-radius: 12px;
    max-width: 450px;
    width: 100%;
    box-shadow: 0 0 35px rgba(255, 0, 0, 0.4);
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-box h3 {
    color: #ff4d4d;
    margin-bottom: 20px;
    text-align: center;
    font-size: 1.2rem;
  }

  .modal-box input, .modal-box textarea {
    width: 100%;
    padding: 12px;
    background: #111;
    border: 1px solid #333;
    color: #fff;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 0.9rem;
  }

  .modal-box textarea {
    min-height: 120px;
    font-family: monospace;
    resize: vertical;
  }

  .modal-box input:focus, .modal-box textarea:focus {
    outline: none;
    border-color: #ff2b2b;
  }

  .modal-box label {
    display: block;
    margin-bottom: 5px;
    color: #ff9999;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
  
  .btn {
    padding: 10px 20px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 8px;
    transition: 0.2s;
    text-align: center;
    flex: 1;
    border: none;
  }

  .btn-green { background: #00ff88; color: #000; }
  .btn-green:hover { background: #00cc6a; }
  .btn-red { background: #ff2b2b; color: #fff; }
  .btn-red:hover { background: #cc0000; }
  .btn-outline { background: transparent; border: 1px solid #ff2b2b; color: #ff4d4d; }
  .btn-outline:hover { background: #1a0000; }

  .admin-card-actions { display: flex; gap: 8px; margin-top: 10px; }
  .admin-card-actions button {
    flex: 1; padding: 8px; font-size: 0.75rem; border-radius: 6px; cursor: pointer; font-weight: 700;
  }

  .empty-msg {
    text-align: center;
    color: #ff9999;
    padding: 50px 10px;
    font-size: 0.95rem;
    grid-column: 1 / -1;
  }

  .toast {
    position: fixed; bottom: 25px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #111; border: 1px solid #00ff88; color: #00ff88;
    padding: 12px 24px; border-radius: 30px; font-size: 0.85rem;
    opacity: 0; transition: 0.3s; z-index: 1000; font-weight: 700;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Input File Kustom */
  .file-input-wrapper {
    position: relative;
    overflow: hidden;
    display: inline-block;
    width: 100%;
  }
  .file-input-wrapper input[type=file] {
    font-size: 100px;
    position: absolute;
    left: 0;
    top: 0;
    opacity: 0;
    cursor: pointer;
  }
  .file-input-btn {
    border: 1px dashed #ff2b2b;
    color: #ff4d4d;
    background: #111;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    display: block;
    width: 100%;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
  }
</style>
</head>
<body>

  <div class="admin-corner">
    <button class="btn-admin-corner" id="loginBtn">🔒 LOGIN ADMIN</button>
    <button class="btn-admin-corner" id="logoutBtn" style="display:none; border-color:#00ff88; color:#00ff88;">🚪 LOGOUT</button>
  </div>

  <div class="header">
    <h1>KUMPULAN SCRIPT ARJ</h1>
    <p>ARJ ONTOP #YOHANGANTENG</p>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="🔍 Cari script di sini...">
  </div>

  <div class="script-grid" id="scriptGrid">
    <div class="empty-msg">Memuat data script...</div>
  </div>

  <!-- MODAL LOGIN -->
  <div class="modal" id="loginModal">
    <div class="modal-box">
      <h3>🔐 LOGIN ADMIN</h3>
      <input type="password" id="passwordInput" placeholder="Masukkan Password" maxlength="20" style="text-align:center; letter-spacing:3px; font-size:1.2rem;">
      <div class="modal-actions">
        <button class="btn btn-green" id="submitLogin">MASUK</button>
        <button class="btn btn-red" id="closeLogin">BATAL</button>
      </div>
    </div>
  </div>

  <!-- MODAL FORM -->
  <div class="modal" id="adminFormModal">
    <div class="modal-box">
      <h3 id="formTitle">⚙️ UPLOAD SCRIPT BARU</h3>
      
      <label>Judul Script</label>
      <input type="text" id="scriptTitle" placeholder="Contoh: Auto Farm Blox Fruits">

      <label>Pilih Foto dari Galeri (Otomatis Upload)</label>
      <div class="file-input-wrapper">
        <button class="file-input-btn" id="fileBtnText">📁 Pilih Gambar...</button>
        <input type="file" id="scriptFile" accept="image/*">
      </div>
      <div style="text-align:center; color:#666; font-size:0.75rem; margin: 10px 0;">- ATAU -</div>

      <label>Link Gambar (URL)</label>
      <input type="text" id="scriptImage" placeholder="https://...">

      <label>Deskripsi Singkat</label>
      <input type="text" id="scriptDesc" placeholder="Deskripsi script...">

      <label>Isi Script (Raw Code)</label>
      <textarea id="scriptContent" placeholder="-- tempel script roblox di sini --"></textarea>

      <div class="modal-actions">
        <button class="btn btn-green" id="saveBtn">💾 SIMPAN SCRIPT</button>
        <button class="btn btn-outline" id="closeFormBtn">TUTUP</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">✔ Berhasil</div>

  <!-- ========================================== -->
  <!-- LOGIC FIREBASE & IMGBB                     -->
  <!-- ========================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // KONFIGURASI FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyDo5CH0HzspnqSMOwt6YJ_NEoJzMC-_ex8",
      authDomain: "yohanarj.firebaseapp.com",
      databaseURL: "https://yohanarj-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "yohanarj",
      storageBucket: "yohanarj.firebasestorage.app",
      messagingSenderId: "809229482324",
      appId: "1:809229482324:web:99892801a403dd6a8a70c1",
      measurementId: "G-NQ8LX794M2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'scripts');

    /* ================= KONFIGURASI IMGBB ================= */
    const IMGBB_API_KEY = "7d99e80ba32f01206cc5f9ef70d98e1f"; 

    /* ================= KONFIGURASI LAIN ================= */
    const ADMIN_PASSWORD = "11";
    const LOGIN_KEY = "arj_admin_logged";

    /* ================= STATE ================= */
    let scripts = [];
    let editingId = null;
    let isAdmin = sessionStorage.getItem(LOGIN_KEY) === "true";

    /* ================= ELEMENT ================= */
    const $ = id => document.getElementById(id);
    const grid = $("scriptGrid");
    const loginBtn = $("loginBtn");
    const logoutBtn = $("logoutBtn");
    const loginModal = $("loginModal");
    const adminFormModal = $("adminFormModal");
    const toast = $("toast");
    const searchInput = $("searchInput");
    const fileInput = $("scriptFile");
    const fileBtnText = $("fileBtnText");

    /* ================= UTIL ================= */
    function showToast(msg, color = "#00ff88") {
      toast.textContent = msg;
      toast.style.borderColor = color;
      toast.style.color = color;
      toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function escapeHtml(str) {
      if(!str) return "";
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    // Tampilkan nama file saat dipilih
    fileInput.addEventListener("change", (e) => {
      if(e.target.files.length > 0) {
        fileBtnText.textContent = "✅ " + e.target.files[0].name;
        fileBtnText.style.color = "#00ff88";
      }
    });

    /* ================= AMBIL DATA REALTIME ================= */
    onValue(dbRef, (snapshot) => {
      scripts = [];
      const data = snapshot.val();
      if (data) {
        for (const key in data) {
          scripts.push({ id: key, ...data[key] });
        }
        scripts.reverse(); 
      }
      render(searchInput.value);
    });

    /* ================= RENDER ================= */
    function render(filterText = "") {
      grid.innerHTML = "";

      const filtered = scripts.filter(sc => 
        (sc.title || "").toLowerCase().includes(filterText.toLowerCase()) || 
        (sc.desc || "").toLowerCase().includes(filterText.toLowerCase())
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-msg">Belum ada script yang tersedia.<br><br>${isAdmin ? 'Silakan klik tombol + UPLOAD SCRIPT di pojok kanan bawah.' : 'Silakan cek kembali nanti.'}</div>`;
        return;
      }

      filtered.forEach(sc => {
        const card = document.createElement("div");
        card.className = "script-card";
        
        let adminButtons = "";
        if (isAdmin) {
          adminButtons = `
            <div class="admin-card-actions">
              <button class="btn-outline" data-edit="${sc.id}">✏️ EDIT</button>
              <button class="btn-red" data-del="${sc.id}">🗑️ HAPUS</button>
            </div>
          `;
        }

        const imgUrl = sc.image ? escapeHtml(sc.image) : 'https://placehold.co/600x400/1a0000/ff2b2b?text=No+Image';
        const views = sc.views || 0;

        card.innerHTML = `
          <img src="${imgUrl}" alt="${escapeHtml(sc.title)}" onerror="this.src='https://placehold.co/600x400/1a0000/ff2b2b?text=No+Image'">
          <div class="card-body">
            <h4>${escapeHtml(sc.title)}</h4>
            <div class="desc">${escapeHtml(sc.desc || "-")}</div>
            
            <div class="card-footer">
              <div class="view-counter">👁️ ${views} Kali Di-Copy</div>
              <button class="copy-btn" data-id="${sc.id}">📋 COPY SCRIPT</button>
              ${adminButtons}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      grid.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => copyScript(btn.dataset.id, btn));
      });

      if (isAdmin) {
        grid.querySelectorAll("[data-edit]").forEach(btn =>
          btn.addEventListener("click", () => startEdit(btn.dataset.edit))
        );
        grid.querySelectorAll("[data-del]").forEach(btn =>
          btn.addEventListener("click", () => deleteScript(btn.dataset.del))
        );
      }
    }

    /* ================= PENCARIAN ================= */
    searchInput.addEventListener("input", (e) => {
      render(e.target.value);
    });

    /* ================= COPY SCRIPT & TAMBAH VIEW ================= */
    function copyScript(id, btn) {
      const sc = scripts.find(s => s.id === id);
      if (!sc) return;

      const doCopy = (text) => {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(() => {
            btn.textContent = "✔ TERSALIN!";
            btn.classList.add("copied");
            showToast("Script berhasil disalin!");
            
            // TAMBAH VIEW KE FIREBASE SECARA REALTIME
            const viewRef = ref(db, `scripts/${id}/views`);
            runTransaction(viewRef, (currentViews) => {
              return (currentViews || 0) + 1;
            });

            setTimeout(() => {
              btn.textContent = "📋 COPY SCRIPT";
              btn.classList.remove("copied");
            }, 2000);
          });
        } else {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
            btn.textContent = "✔ TERSALIN!";
            btn.classList.add("copied");
            showToast("Script berhasil disalin!");
            
            // TAMBAH VIEW KE FIREBASE
            const viewRef = ref(db, `scripts/${id}/views`);
            runTransaction(viewRef, (currentViews) => {
              return (currentViews || 0) + 1;
            });

            setTimeout(() => {
              btn.textContent = "📋 COPY SCRIPT";
              btn.classList.remove("copied");
            }, 2000);
          } catch (e) {
            showToast("Gagal menyalin", "#ff2b2b");
          }
          document.body.removeChild(ta);
        }
      };

      doCopy(sc.content);
    }

    /* ================= LOGIN / LOGOUT ================= */
    loginBtn.addEventListener("click", () => {
      loginModal.classList.add("show");
      $("passwordInput").value = "";
      setTimeout(() => $("passwordInput").focus(), 100);
    });

    $("closeLogin").addEventListener("click", () => loginModal.classList.remove("show"));

    $("submitLogin").addEventListener("click", tryLogin);
    $("passwordInput").addEventListener("keydown", e => {
      if (e.key === "Enter") tryLogin();
    });

    function tryLogin() {
      const pw = $("passwordInput").value;
      if (pw === ADMIN_PASSWORD) {
        isAdmin = true;
        sessionStorage.setItem(LOGIN_KEY, "true");
        loginModal.classList.remove("show");
        updateAdminUI();
        render(searchInput.value);
        showToast("Login admin berhasil!");
      } else {
        showToast("Password salah!", "#ff2b2b");
        $("passwordInput").value = "";
      }
    }

    logoutBtn.addEventListener("click", () => {
      isAdmin = false;
      sessionStorage.removeItem(LOGIN_KEY);
      updateAdminUI();
      render(searchInput.value);
      showToast("Logout berhasil", "#ff9999");
    });

    /* ================= FORM ADMIN ================= */
    function openForm(isEdit = false) {
      adminFormModal.classList.add("show");
      if (!isEdit) {
        $("formTitle").textContent = "⚙️ UPLOAD SCRIPT BARU";
        $("scriptTitle").value = "";
        $("scriptImage").value = "";
        $("scriptDesc").value = "";
        $("scriptContent").value = "";
        fileInput.value = ""; 
        fileBtnText.textContent = "📁 Pilih Gambar...";
        fileBtnText.style.color = "#ff4d4d";
        editingId = null;
      } else {
        $("formTitle").textContent = "✏️ EDIT SCRIPT";
      }
    }

    $("closeFormBtn").addEventListener("click", () => {
      adminFormModal.classList.remove("show");
      editingId = null;
    });

    // PROSES SIMPAN (UPLOAD KE IMGBB + SIMPAN KE FIREBASE)
    $("saveBtn").addEventListener("click", async () => {
      const title = $("scriptTitle").value.trim();
      const imageLink = $("scriptImage").value.trim();
      const desc  = $("scriptDesc").value.trim();
      const content = $("scriptContent").value.trim();
      const file = fileInput.files[0];

      if (!title || !content) {
        showToast("Judul & isi script wajib diisi!", "#ff2b2b");
        return;
      }

      $("saveBtn").textContent = "⏳ MENYIMPAN...";
      $("saveBtn").disabled = true;

      try {
        let finalImageUrl = imageLink;

        // JIKA ADMIN MEMILIH FOTO DARI GALERI, UPLOAD KE IMGBB
        if (file) {
          const formData = new FormData();
          formData.append("image", file);

          const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: "POST",
            body: formData
          });
          
          const result = await response.json();
          
          if (result.success) {
            finalImageUrl = result.data.url; 
          } else {
            throw new Error("Gagal upload ke ImgBB");
          }
        }

        const dataScript = { 
          title, 
          image: finalImageUrl, 
          desc, 
          content 
        };

        if (editingId) {
          const scriptRef = ref(db, `scripts/${editingId}`);
          update(scriptRef, dataScript).then(() => {
            showToast("Script berhasil diupdate!");
          });
        } else {
          dataScript.views = 0;
          push(dbRef, dataScript).then(() => {
            showToast("Script berhasil diupload!");
          });
        }

        adminFormModal.classList.remove("show");
        editingId = null;
      } catch (error) {
        console.error(error);
        showToast("Gagal upload gambar, cek koneksi!", "#ff2b2b");
      } finally {
        $("saveBtn").textContent = "💾 SIMPAN SCRIPT";
        $("saveBtn").disabled = false;
      }
    });

    function startEdit(id) {
      const sc = scripts.find(s => s.id === id);
      if (!sc) return;
      editingId = id;
      
      $("scriptTitle").value = sc.title;
      $("scriptImage").value = sc.image || "";
      $("scriptDesc").value = sc.desc;
      $("scriptContent").value = sc.content;
      fileInput.value = "";
      fileBtnText.textContent = "📁 Ganti Gambar (Opsional)";
      
      openForm(true);
    }

    function deleteScript(id) {
      if (!confirm("Yakin hapus script ini?")) return;
      const scriptRef = ref(db, `scripts/${id}`);
      remove(scriptRef).then(() => {
        showToast("Script dihapus", "#ff2b2b");
      });
    }

    /* ================= TOMBOL TAMBAH SCRIPT (FAB) ================= */
    function updateAdminUI() {
      if (isAdmin) {
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        
        if (!document.getElementById("fabAdd")) {
          const fab = document.createElement("button");
          fab.id = "fabAdd";
          fab.innerHTML = "+ UPLOAD SCRIPT";
          fab.style.cssText = `
            position: fixed; bottom: 25px; right: 25px; z-index: 500;
            background: #00ff88; color: #000; border: none; padding: 15px 25px;
            border-radius: 30px; font-weight: 900; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6); font-size: 0.9rem;
            transition: 0.2s;
          `;
          fab.onmouseover = () => fab.style.transform = "scale(1.05)";
          fab.onmouseout = () => fab.style.transform = "scale(1)";
          fab.onclick = () => openForm(false);
          document.body.appendChild(fab);
        }
      } else {
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        
        const fab = document.getElementById("fabAdd");
        if (fab) fab.remove();
      }
    }

    /* ================= INIT ================= */
    updateAdminUI();
  </script>
</body>
</html>
